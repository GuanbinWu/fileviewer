
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享文件</title>
<style>
:root {
  --myshadow:#3b2700;
  --balck: #503a0e;
  --balck_alpha: #412b018a;
  --white: #e6e6e6;
  --gray: #555555;
  --blue:#1091db;
  --shadow:#3b270085;
  --fsize_big:32px;
  --fsize_middle:16px;
  --fsize_small:14px;
  --my-boder-radius:4px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--white);
  color: var(--balck);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 顶部工具栏 */
.toolbar {
  display: flex;
  align-items: center;
  padding: 12px 12px;
  background: var(--white);
  border-top: 14px solid var(--balck);
  gap: 4px;
  flex-shrink: 0;
}
.toolbar .path {
  flex: 1;
  font-size: var(--fsize_middle);
  color: var(--balck);
  background: var(--white);
  padding: 4px 6px;
  /* overflow: hidden; */
  /* text-overflow: ellipsis; */
  /* white-space: nowrap; */
  border: 2px solid var(--balck);
  border-radius: var(--my-boder-radius);
}
.toolbar .btn {
  background: var(--balck);
  border: 1px solid var(--white);
  padding: 6px 16px;
  /* border-radius: 4px; */
  color: var(--white);
  cursor: pointer;
  font-size: var(--fsize_middle);
  transition: all 0.15s;
  border-radius: var(--my-boder-radius);
}
.toolbar .btn:hover { background: var(--blue); }
.toolbar .btn.primary { background: var(--balck); color: var(--white); border-color: var(--balck); }
.toolbar .btn.primary:hover { background: var(--blue); }
.toolbar .btn.danger { background: #ff4d4f; color: #fff; border-color: #ff4d4f; }
.toolbar .btn.danger:hover { background: #ff7875; }
.toolbar .selected-info {
  font-size:  var(--fsize_middle);
  color: var(--blue);
  margin-left: 8px;
}

/* 文件列表容器 */
.file-table {
  width: 100%;
  border-collapse: collapse;
  background-color: var(--white);
}
.file-table th{
  color: var(--white);
  /* border-bottom: 2px solid var(--white);
  border-top: 2px solid var(--white); */
  background-color: var(--balck);
  padding: 6px 10px;
}
/* .file-table th td{
  padding: 8px;
  border: 1px solid var(--white);
  text-align: center;
  color:var(--white),
} */
.file-table td {
  padding: 8px;
  border-bottom: 1px solid var(--myshadow);
  text-align: center;
  /* vertical-align: middle; */
  color:var(--balck);
  
}
.file-table tr {
  border-top: 1px solid var(--gray);
  border-bottom: 1px solid var(--gray);
  font-size:  var(--fsize_middle);
  border-bottom: 1px solid var(--white);
}

.file-table tr.selected {
  background-color: var(--blue);
  color:var(--white),
}



.file-table tr:hover {
  cursor:pointer;
  background-color: var(--blue);
}
.file-table tr:hover th {
  background-color: var(--balck) !important;
  cursor: default;
}

.file-icon {
  margin-right: 8px;
  font-size:  var(--fsize_middle);
  vertical-align: middle;
}

html, body {
  height: 100%;
  margin: 0;
}
.layout {
  display: flex;
  height: 100vh;
  width: 100%;
}
/* 左侧栏 */
.sidebar {
  width: 200px;
  background: var(--balck);
  color: var(--white);
  padding-top: 12px;
  padding-bottom: 12px;
  padding-right: 12px;
  padding-left: 12px;
  box-sizing: border-box;
  position: relative;
  height: 100%;
  /* border-right: solid 2px var(--myshadow); */
  /* border-left: solid 12px var(--myshadow); */
  gap:12px;
  display: flex; 
  flex-direction: column;
  /* border-radius: var(--my-boder-radius); */
}
.sidebar-title {
  font-size:  var(--fsize_middle);
  margin-bottom: 12px;
  color: var(--white);
  padding: 10px 8px;
  border-radius: var(--my-boder-radius);
}

.sidebar-info {
  padding: 10px 8px;
  border-radius: 6px;
  border: var(--white);
  font-size: var(--fsize_big);
  border-radius: var(--my-boder-radius);
}


.sidebar-item {
  padding: 10px 8px;
  /* border-radius: 6px; */
  cursor: pointer;
  margin-top:1px;
  margin-bottom: 1px;
  font-size:  var(--fsize_middle);
  color: var(--white);
  border: solid 2px var(--myshadow);
  border-radius: var(--my-boder-radius);

}

.sidebar-footer {
  /* position: absolute; */
  margin-top: auto;
  padding-top: 12px;
  text-align: center;
  font-size:  var(--fsize_middle);
  color: var(--white);
  /* bottom: 2%; */
  border-top: 2px solid var(--white);
  border-radius: var(--my-boder-radius);
}

.sidebar-item:hover {
  background: var(--blue);
  /* color: var(--blue); */
}
/* 右侧主区域 */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* 文件区域滚动不变 */
.file-container {
  flex: 1;
  overflow: auto;
}


/* 复选框列 - 默认隐藏，多选模式下显示 */
.check-col { width: 36px; text-align: center; }
.check-col input[type="checkbox"] {
  display: none;
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.multi-select-active .check-col input[type="checkbox"] { display: inline-block; }

/* 右键菜单 */
.context-menu {
  position : fixed;
  background : var(--white);
  /* border : 1px solid var(--balck); */
  /* box-shadow : 2px 2px 6px var(--balck_alpha); */
  z-index : 1000;
  border-radius: var(--my-boder-radius);
}



.context-menu .menu-item {
  display : block;
  font-size: var(--fsize_middle);
  width : 100%;
  padding : 6px 12px;
  background : var(--white);
  cursor : pointer;
  color: var(--balck);
  /* border-radius: var(--my-boder-radius); */
  border-bottom: 1px solid var(--balck);; 
}
.context-menu .menu-item:hover { background: var(--blue); }

/* 加载/错误状态 */
.loading, .error {
  padding: 40px;
  text-align: center;
  color: #999;
  font-size:  var(--fsize_middle);
  /* border-top: 0px solid var(--balck); */
}
.error { color: #ff4d4f; }



.modal-overlay {
  position: fixed; inset: 0; background: var(--balck_alpha);
  display: flex; align-items: center; justify-content: center; z-index: 999;
}
.modal-box {
  background: var(--white); padding: 12px; border-radius: 0px;
  min-width: 720px; box-shadow: 0 8px 30px var(--balck);
  justify-content: center;
}
.modal-title { margin: 0 0 12px; font-size: var(--fsize_middle);background-color: var(--balck);color: var(--white); justify-content:center;}
.modal-input {
  width: 100%; padding: 6px 12px; border: 1px solid var(--white);
  border-radius: 0px; font-size: 1rem; margin-bottom: 16px;
  box-sizing: border-box;
}
.modal-error { display:flex;padding: 2px 12px;font-size: var(--fsize_small);justify-content: center;}
.modal-btn-container{
  display: flex;
  padding-top: 8px;
  padding-bottom: 8px;
  
  justify-content: center;
  flex-direction:row;
  gap: 30px;
  /* align-items: ; */
}
.modal-btn { padding: 8px 10px;
  display: flex; 
  justify-content: center; 
  /* gap: 30px;  */
  width: 100%;
  font-size: var(--fsize_middle);
  color: var(--white);
  background-color: var(--balck);}

.modal-btn:hover{background: var(--blue); }

.previewer {
  background: var(--balck_alpha);   /* 半透明遮罩 */
  position: fixed;                   /* 固定定位，覆盖全屏 */
  inset: 0;                          /* top:0;right:0;bottom:0;left:0 */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  flex-direction: column;
  gap: 12px;
  padding: 5%;
}

.text-editor {
  width: 50%;
  height: 100%;
  border: var(--balck);
  font-family: monospace;
  font-size:var(--fsize_middle);
  padding-top: 18px;
  padding-bottom: 18px;
  padding-left: 36px;
  padding-right: 36px;

  box-sizing: border-box;
  background: var(--white);
}



</style>
</head>
<body>




<div class="layout">

  <!-- 左侧栏（新增） -->
  <div class="sidebar">
    <div class="sidebar-title"><a href="https://guanbinwu.github.io" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;" >FileViewer v0.1.0</a></div>
    <div class="sidebar-info">欢迎,</div>
    <div class="sidebar-info" id="sidebar-username"></div>
    <div class="sidebar-item" id ="mainPage">回到首页</div>
    <div class="sidebar-item" id ="upLoadFiles" title="上传一个或多个文件，但不能包含文件夹">上传文件</div>
    <div class="sidebar-item" id ="upLoadFolder" title="选择一个文件夹，会上传包含的所有子文件与子文件夹（递归）">上传文件夹</div>
    <div class="sidebar-item" id = "log" title="查看最新的50条用户记录">查看日志</div>
    <div class="sidebar-item" id = "setting" >设置</div>
    <div class="sidebar-item" id ="logout">登出</div>
    <div class="sidebar-footer">
      <p>单击目录：进入目录</p>
      <p>双击文件：预览/编辑</p>
      <p>右键单击：打开菜单</p>
      <p>如果不能再见到你，祝你早、午、晚都安。</p>
    </div>
  </div>

  <!-- 右侧主内容（原内容整体移动进来） -->
   
  <div class="main">

    <!-- 工具栏 -->
    <div class="toolbar">
      
      <button class="btn" id="mkdir">📁新建文件夹</button>
      
      <button class="btn" id="refreshBtn" >⟳ 刷新</button>
      <button class="btn" id="parentBtn">⬆ 回到上级</button>
      <div class="path" id="currentPath"></div>
      <button class="btn primary" id="multiSelectBtn">☐ 多选模式</button>
      <button class="btn danger" id="cancelSelectBtn" style="display:none;">取消选择</button>
      <span class="selected-info" id="selectedInfo"></span>
    </div>

    <!-- 文件列表 -->
    <div class="file-container" id="fileContainer">
      <table class="file-table" id="fileTable">
        <thead id="fileTableThead">

        </thead>
        <tbody id="fileBody"></tbody>
      </table>
      <div class="loading" id="loadingState">到底部了</div>
      <div class="error" id="errorState" style="display:none;"></div>
    </div>

  </div>
  <!-- <div class="sidebar" style="width: 2px;border: none;"> </div> -->
</div>

</body>
</html>
