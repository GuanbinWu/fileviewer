[package]
name = "fileviewer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
#tower = { version = "0.4.13", features = ["full"] }
#tower-http = { version = "0.4", features = ["fs", "trace", "compression-br"] }
warp="0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json="1.0"
parking_lot="0.12"
bytes={version="1.12",features=["serde"]}
#sqlx="0.9"
sqlx = { version = "0.8", features = [ "runtime-tokio","postgres","chrono" ] }
#sqlx={version="0.9",features=["runtime-tokio-rustls","migrate","postgres"]}
rand="0.8"
rust-argon2="1.0"
paseto="2.0"
clap = { version = "4.6.1", features = ["derive"] }
chrono="0.4.19"
thiserror="2.0"
mime_guess="2.0"
md5="0.8"
base64 = "0.22"
